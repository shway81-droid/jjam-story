<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짬짬이 이야기 — 자투리 시간 이야기 말하기 활동</title>
  <meta name="description" content="수업 전후 3~7분 자투리 시간에 전자칠판으로 바로 시작하는 초등 이야기 말하기 활동. 짧은 이야기 20편, 단계별 진행과 타이머, 설치·로그인 없음.">
  <meta name="theme-color" content="#6145B5">
  <meta property="og:title" content="짬짬이 이야기">
  <meta property="og:description" content="짧은 이야기 하나로, 교사의 준비는 줄이고 학생의 생각과 말은 늘린다.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <!-- 폰트는 css/style.css의 @font-face로 자가 호스팅한다(외부 CDN 없음 → 오프라인 동작). -->
  <link rel="preload" href="assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="brand-home">
      <span class="brand-icon"><img class="ic" src="favicon.svg" alt="" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">짬짬이 이야기</span>
        <span class="brand-sub">수업 전후 3~7분, 생각하고 말하기</span>
      </span>
    </a>
    <div class="topbar-actions">
      <button id="btn-home" class="icon-btn" type="button" aria-label="처음으로"><img class="ic" src="icons/home-1.svg" alt="" aria-hidden="true"></button>
      <!-- 자매 사이트 바로가기 — 내용·스타일은 shared/jjam-switcher.js 안에 있다.
           활동 중(screen-play)에는 js/app.js 가 숨긴다 — 발표 중에 눌러 나가지 않도록. -->
      <div class="jjam-switch" data-site="story" id="site-switch"></div>
    </div>
  </header>

  <main id="app">
    <!-- 1. 홈: 이야기 유형 선택 -->
    <section id="screen-home" class="screen">
      <div class="cta-strip">
        <p class="cta-copy"><b>수업 자투리 시간,</b> <b>100가지</b>의 재밌는 이야기로 학생들과 즐거운 시간 보내기</p>
      </div>

      <div class="type-grid" id="type-grid" aria-label="이야기 유형 선택"></div>

      <section class="fav-section" id="fav-section" hidden>
        <h2><img class="ic" src="icons/star-medal.svg" alt="" aria-hidden="true">즐겨찾기</h2>
        <div class="story-chip-row" id="fav-row"></div>
      </section>

      <section class="fav-section" id="recent-section" hidden>
        <h2><img class="ic" src="icons/circle-clock.svg" alt="" aria-hidden="true">최근 사용</h2>
        <div class="story-chip-row" id="recent-row"></div>
      </section>

      <footer class="site-footer">
        <p>정답보다 근거와 상상을 칭찬해 주세요.</p>
        <p class="credit">
          아이콘
          <a href="https://github.com/webalys-hq/streamline-vectors" target="_blank" rel="noopener">Streamline Plump Color</a>
          · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
        </p>
      </footer>
    </section>

    <!-- 2. 조건 선택 -->
    <section id="screen-setup" class="screen" hidden>
      <h1 class="setup-title" id="setup-title"></h1>

      <div class="setup-group">
        <h2>학년</h2>
        <div class="option-row" id="opt-grade" role="radiogroup" aria-label="학년 선택"></div>
      </div>

      <div class="setup-group">
        <h2>활동 시간</h2>
        <div class="option-row" id="opt-duration" role="radiogroup" aria-label="활동 시간 선택"></div>
      </div>

      <div class="setup-actions">
        <button class="btn btn-ghost" id="btn-setup-back" type="button">← 유형 다시 고르기</button>
        <button class="btn btn-primary btn-big" id="btn-start" type="button"><img class="ic" src="icons/button-play-circle.svg" alt="" aria-hidden="true">이야기 시작</button>
      </div>
    </section>

    <!-- 3. 진행 (이야기~발표~확장) -->
    <section id="screen-play" class="screen play" hidden>
      <div class="play-top">
        <div class="stage-dots" id="stage-dots" aria-label="진행 단계"></div>
        <div class="play-top-right">
          <button class="icon-btn" id="btn-fav" type="button" aria-label="즐겨찾기"><img class="ic" src="icons/star-medal.svg" alt="" aria-hidden="true"></button>
          <button class="btn btn-ghost btn-sm" id="btn-swap" type="button"><img class="ic" src="icons/shuffle.svg" alt="" aria-hidden="true">다른 이야기</button>
        </div>
      </div>

      <div class="stage-header">
        <h1 class="stage-title" id="stage-title"></h1>
      </div>

      <div class="stage-body" id="stage-body"></div>

      <div class="play-bottom">
        <div class="timer" id="timer-wrap">
          <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
          <div class="timer-row">
            <span class="timer-digits" id="timer-digits">0:00</span>
            <div class="timer-btns">
              <button class="btn btn-ghost btn-sm" id="btn-pause" type="button"><img class="ic" src="icons/button-pause-circle.svg" alt="" aria-hidden="true">일시정지</button>
              <button class="btn btn-ghost btn-sm" id="btn-plus30" type="button">+30초</button>
            </div>
          </div>
        </div>
        <div class="step-nav">
          <button class="btn btn-ghost btn-big" id="btn-prev" type="button">← 이전 단계</button>
          <button class="btn btn-primary btn-big" id="btn-next" type="button">다음 단계 →</button>
        </div>
      </div>
    </section>

    <!-- 4. 마무리 -->
    <section id="screen-done" class="screen done" hidden>
      <div class="done-emoji"><img class="ic" src="icons/balloon.svg" alt="" aria-hidden="true"></div>
      <h1 id="done-praise"></h1>
      <p class="done-sub" id="done-sub"></p>
      <div class="done-actions">
        <button class="btn btn-primary btn-big" id="btn-again" type="button"><img class="ic" src="icons/shuffle.svg" alt="" aria-hidden="true">같은 조건, 다른 이야기</button>
        <button class="btn btn-ghost btn-big" id="btn-done-home" type="button"><img class="ic" src="icons/home-1.svg" alt="" aria-hidden="true">처음으로</button>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="shared/jjam-switcher.js" defer></script>
</body>
</html>
